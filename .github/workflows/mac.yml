name: mac
# clai for Mac: tests (macOS and Linux), the universal app, a smoke test of the packaged app and
# screenshots. A `mac-v*` tag publishes clai-mac.dmg, clai-mac.zip and checksums.txt as a GitHub
# release, which getclai.vercel.app/download links to. So does a manual run with a `release`
# version, which creates the `mac-v<version>` tag on the commit it built.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['mac-v*']
    paths:
      - 'apps/mac/**'
      - '.github/workflows/mac.yml'
  pull_request:
    paths:
      - 'apps/mac/**'
      - '.github/workflows/mac.yml'
  # A release published from GitHub's web form (which creates its `mac-v*` tag) gets the files too.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish this build as release mac-v<version>, e.g. 1.1.0. Empty: a test build.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-on-linux:
    # The log readers, prices and ledger are Foundation only; this keeps them building on Linux.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        working-directory: apps/mac
        run: swift test

  app:
    if: github.event_name != 'release' || startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # Developer ID signing and notarization turn on when the repository has these secrets.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m
      - name: Tests
        working-directory: apps/mac
        run: swift test
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" $(security list-keychains -d user | tr -d '"')
      - name: Build the app
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || '' }}
        # A release build takes its version from the tag (mac-v1.0.1 builds 1.0.1) or the manual run's input.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mac-v* ]]; then export VERSION="${GITHUB_REF#refs/tags/mac-v}"; fi
          if [[ -n "$RELEASE" ]]; then
            [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release must be a version like 1.1.0, not '$RELEASE'"; exit 1; }
            export VERSION="$RELEASE"
          fi
          apps/mac/scripts/build-app.sh
      - name: Smoke test
        run: apps/mac/scripts/smoke-test.sh
      - name: Screenshots of the running app
        continue-on-error: true
        timeout-minutes: 3
        run: apps/mac/scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clai-mac
          path: apps/mac/build/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: apps/mac/build/screens/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/mac-v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for apps/mac/release-notes/<version>.md, what is new in this version.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: apps/mac/release-notes
      - uses: actions/download-artifact@v4
        with:
          name: clai-mac
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/mac-v') && github.ref_name || format('mac-v{0}', inputs.release) }}
        run: |
          [[ "$TAG" =~ ^mac-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          VERSION="${TAG#mac-v}"
          {
            echo "clai for Mac $VERSION: your AI usage in the menu bar, priced at API list prices from the logs Claude Code, Codex, Gemini CLI, Qwen Code and OpenCode keep on your Mac, with Claude's plan limits and an organization's usage report from Anthropic. Usage data stays on your Mac."
            echo
            if [ -f "apps/mac/release-notes/$VERSION.md" ]; then
              cat "apps/mac/release-notes/$VERSION.md"
              echo
            fi
            echo "**Download:** [clai-mac.dmg](https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/clai-mac.dmg) (Apple silicon and Intel, macOS 13 or later), or from https://getclai.vercel.app"
            echo
            echo "**First launch.** This build is not notarized by Apple yet, so macOS says it cannot check clai for malware. Click Done, open System Settings → Privacy & Security, click **Open Anyway** next to clai and confirm. Or install from Terminal, which skips that prompt:"
            echo
            echo '```'
            echo 'curl -fsSL https://getclai.vercel.app/install.sh | sh'
            echo '```'
            echo
            echo "**Updating.** Run the Terminal command again, or quit clai (right-click its menu bar item → Quit clai) and drag the new copy into Applications; macOS does not replace a running app. Your daily totals carry over."
            echo
            echo "**SHA-256**"
            echo
            echo '```'
            cat dist/checksums.txt
            echo '```'
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "clai for Mac $VERSION" --notes-file notes.md
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "clai for Mac $VERSION" --notes-file notes.md --verify-tag
          else
            # A manual run: the tag is created on the commit that was built.
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "clai for Mac $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
