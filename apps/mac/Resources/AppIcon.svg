<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- clai for Mac app icon: the tally on a ledger-green squircle. Rendered to AppIcon.png by scripts/render-icon.mjs. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23866C"/>
      <stop offset="1" stop-color="#0E5444"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#032A21" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#ground)" filter="url(#drop)"/>

  <g filter="url(#markShadow)" stroke="#FFFFFF" stroke-linecap="round" stroke-width="58" fill="none">
    <line x1="362" y1="338" x2="362" y2="690"/>
    <line x1="462" y1="338" x2="462" y2="690"/>
    <line x1="562" y1="338" x2="562" y2="690"/>
    <line x1="662" y1="338" x2="662" y2="690"/>
    <line x1="292" y1="628" x2="732" y2="400"/>
  </g>

  <rect x="103" y="103" width="818" height="818" rx="182.4" fill="none" stroke="url(#rim)" stroke-width="5"/>
</svg>
